version: 1
name: Remind
slug: remind

# Browser-bridge MCP: the one-time credential lift runs over the fetchproxy
# bridge, so a hosted registration also needs `runtime: fly-shared`,
# `bridge: true` and `bridgePortEnv: REMIND_WS_PORT`. Those are registration
# fields set over the control API (PUT /api/v1/registrations/<id>) — the
# manifest schema has no column for them.
#
# Only the BOOTSTRAP needs the browser. Once a session is captured it is cached
# under the data dir, and every tool call is a plain server-side fetch — so a
# restarted child does not need the browser again. That caching is load-bearing
# here rather than an optimisation: the capture completes only while the
# signed-in tab happens to issue a /graphql request, so a cold start that had to
# re-capture would hang unless someone were actively using Remind.
#
# Supplying REMIND_COOKIE + REMIND_CSRF_TOKEN as secrets skips the bridge
# entirely and makes the registration serverless-safe.

env:
  - name: REMIND_COOKIE
    secret: true
    required: false
    help: >-
      Captured Cookie request header from a signed-in remind.com tab. Optional:
      the fetchproxy bridge captures it automatically when absent.
  - name: REMIND_CSRF_TOKEN
    secret: true
    required: false
    help: >-
      Captured x-csrf-token request header value. Optional; paired with
      REMIND_COOKIE.
  - name: REMIND_WS_PORT
    required: false
    help: >-
      fetchproxy bridge concentrator port (default 37149). A hosted bridged
      registration has this injected per-registration via bridgePortEnv.
  - name: REMIND_SESSION_FILE
    required: false
    help: >-
      Path to the cached session file. Defaults to MCP_DATA_DIR (or HOME) under
      .remind-mcp.

state:
  dataDir: true
  reason: >-
    Two things live here. The fetchproxy identity is at
    $HOME/.fetchproxy/identity/remind-mcp.json and the browser pair code derives
    from it, so without persistence every cold start mints a fresh identity and
    re-prompts pairing. The captured Remind session is cached alongside it under
    .remind-mcp/session.json (0600); without that, a restart re-runs the bridge
    capture, which can only complete while a signed-in tab is issuing requests.

egress:
  # The only host the Node process fetches is www.remind.com/graphql. The bare
  # `remind.com` apex in src/session.ts is the fetchproxy *browser* domain
  # declaration, not server egress, so it is deliberately not listed.
  allow:
    - www.remind.com
